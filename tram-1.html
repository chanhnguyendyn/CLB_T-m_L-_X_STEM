<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trạm 1: “Đất nặn cảm xúc” - Emotion in 3D</title>
  <link rel="stylesheet" href="style.css" />
  <meta name="color-scheme" content="only light">
</head>
<body data-station="tram1">
  <main class="home-stage detail-stage" id="detailStage">
    <div class="decor-layer" id="decorLayer"></div>

    <div class="detail-container">
      <h1 class="detail-heading">
        Trạm 1: “Đất nặn cảm xúc”<br />
        <span class="detail-heading-sub">- Emotion in 3D</span>
      </h1>

      <div class="sheet-box" id="sheetContentBox">
        <div class="sheet-box-text" id="sheetContentText">Đang tải nội dung...</div>
      </div>

      <div class="detail-controls">
        <button type="button" class="complete-btn" id="completeGameBtn">
          Hoàn tất trò chơi<br />Nhận quà
        </button>

        <button type="button" class="arrow-nav arrow-right" id="nextStationBtn" data-target="tram-2.html">
  <span class="arrow-label">
    Đi tiếp trạm 2<br />“Xưởng quang phổ”
  </span>
  <svg class="arrow-shape arrow-shape-right" viewBox="0 0 110 120" fill="none" aria-hidden="true">
    <defs>
      <linearGradient id="arrowGradRight" gradientUnits="userSpaceOnUse" x1="0" y1="60" x2="110" y2="60">
        <stop offset="0%" stop-color="#ffc25c" />
        <stop offset="55%" stop-color="#ffb05c" />
        <stop offset="100%" stop-color="#ff9d5c" />
      </linearGradient>
    </defs>
    <path
      d="M0 14 L42 14 L42 6 C42 1 47 -2 51 1 L104 54 C107 57 107 63 104 66 L51 119 C47 122 42 119 42 114 L42 106 L0 106 Z"
      fill="url(#arrowGradRight)"
    />
  </svg>
</button>
      </div>
    </div>

    <div class="result-modal" id="resultModal" aria-hidden="true">
      <div class="result-modal-backdrop" id="resultModalBackdrop"></div>
      <div class="result-box" role="dialog" aria-modal="true">
        <div class="tick-row" id="tickRow"></div>
        <p class="result-message">Hoàn tất trò chơi - Đưa<br />cho người đứng quầy</p>
        <button type="button" class="result-close-btn" id="closeResultBtn">Đóng</button>
      </div>
    </div>
  </main>

 <div class="cloud-transition" id="cloudTransition" aria-hidden="true">
  <img src="assets/ui/decor/clouds/Cloud-1.png" alt="" class="cloud-piece cloud-1" />
  <img src="assets/ui/decor/clouds/Cloud-1.png" alt="" class="cloud-piece cloud-2" />
  <img src="assets/ui/decor/clouds/Cloud-1.png" alt="" class="cloud-piece cloud-3" />
  <img src="assets/ui/decor/clouds/Cloud-1.png" alt="" class="cloud-piece cloud-4" />
  <img src="assets/ui/decor/clouds/Cloud-1.png" alt="" class="cloud-piece cloud-5" />
  <img src="assets/ui/decor/clouds/Cloud-1.png" alt="" class="cloud-piece cloud-6" />
  <img src="assets/ui/decor/clouds/Cloud-1.png" alt="" class="cloud-piece cloud-7" />
  <img src="assets/ui/decor/clouds/Cloud-1.png" alt="" class="cloud-piece cloud-8" />
  <img src="assets/ui/decor/clouds/Cloud-1.png" alt="" class="cloud-piece cloud-9" />
  <img src="assets/ui/decor/clouds/Cloud-1.png" alt="" class="cloud-piece cloud-10" />
  <img src="assets/ui/decor/clouds/Cloud-1.png" alt="" class="cloud-piece cloud-11" />
</div>

  <script src="effects.js"></script>
  <script src="main.js"></script>
</body>
</html>
